<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2552"/>
      <stop offset=".45" stop-color="#4B3F7E"/>
      <stop offset=".75" stop-color="#B8617A"/>
      <stop offset="1" stop-color="#F0A45B"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7925A"/>
      <stop offset="1" stop-color="#2A2450"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE3A0"/>
      <stop offset=".55" stop-color="#F8C064"/>
      <stop offset="1" stop-color="#F8C064" stop-opacity="0"/>
    </radialGradient>
    <g id="baobab">
