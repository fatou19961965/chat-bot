            fill="none" stroke="#161B3A" stroke-linecap="round" stroke-width="10"/>
      <path d="M-46 0 C-44 -50 -40 -100 -34 -140 L-10 -140 C-6 -100 -2 -50 2 0 Z" fill="#161B3A"/>
      <path d="M-40 -136 C-34 -150 -18 -150 -12 -136 Z" fill="#161B3A"/>
    </g>
  </defs>

  <rect width="1600" height="420" fill="url(#sky)"/>
