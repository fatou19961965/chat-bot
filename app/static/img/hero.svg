  <!-- dunes lointaines -->
  <path d="M0 320 C180 290 320 300 470 312 C640 326 760 296 930 304 C1110 312 1260 292 1420 300 C1500 304 1560 310 1600 312 L1600 420 L0 420 Z" fill="#7A4A6E" opacity=".55"/>

  <!-- fleuve -->
  <rect y="340" width="1600" height="80" fill="url(#water)"/>
  <g stroke="#FFD98A" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M1060 352 h120"/><path d="M1080 364 h80"/><path d="M1095 376 h50"/><path d="M1105 388 h30"/>
  </g>

  <!-- rive et baobabs -->
  <path d="M0 344 C120 330 260 336 380 342 C470 346 560 340 620 344 L620 420 L0 420 Z" fill="#161B3A"/>
  <path d="M1330 346 C1420 334 1520 336 1600 340 L1600 420 L1330 420 Z" fill="#161B3A"/>
  <use href="#baobab" transform="translate(250 344) scale(1.05)"/>
  <use href="#baobab" transform="translate(470 344) scale(.62)"/>
  <use href="#baobab" transform="translate(1480 342) scale(-.78 .78)"/>

  <!-- pirogue -->
  <g transform="translate(760 372)">
    <path d="M-120 -6 C-80 14 80 14 124 -10 C130 -14 128 -18 120 -16 C70 -4 -70 -4 -116 -14 C-124 -16 -126 -10 -120 -6 Z" fill="#161B3A"/>
    <path d="M-92 -2 C-40 6 40 6 96 -4" stroke="#E0B341" stroke-width="3" fill="none"/>
    <path d="M-14 -8 L-10 -58 M-10 -58 C-2 -54 6 -50 10 -44" stroke="#161B3A" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M-10 -58 C-26 -40 -40 -24 -60 -14" stroke="#161B3A" stroke-width="4" stroke-linecap="round" fill="none"/>
